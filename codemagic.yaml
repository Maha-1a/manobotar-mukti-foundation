workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: 3.19.6
      java: 17
    scripts:
      - name: Force MultiDex in Gradle
        script: |
          sed -i '' 's/defaultConfig {/defaultConfig {\n        multiDexEnabled true/' android/app/build.gradle || true
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Build Android APK
        script: |
          flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
