workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: 3.19.6
      java: 17
    scripts:
      - name: Re-create Android files clean
        script: |
          rm -rf android
          flutter create . --platforms=android --org com.manobotarmukti.app
      - name: Build Android APK
        script: |
          flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
