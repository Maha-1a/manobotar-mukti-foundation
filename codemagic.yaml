workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: 3.19.6
      java: 17
    scripts:
      - name: Recreate Android files
        script: |
          flutter create . --platforms=android
      - name: Enable MultiDex in build.gradle
        script: |
          BUILD_FILE="android/app/build.gradle"
          if [ -f "$BUILD_FILE" ]; then
            sed -i '' 's/defaultConfig {/defaultConfig {\n        multiDexEnabled true/' "$BUILD_FILE"
            echo "MultiDex enabled successfully!"
          else
            echo "build.gradle not found!"
          fi
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Build Android APK
        script: |
          flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
