workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      java: 17
      flutter: stable
    scripts:
      - name: Generate Android project files
        script: |
          flutter create . --platforms=android
      - name: Build Android APK
        script: |
          flutter build apk --debug
    artifacts:
      - build/**/outputs/**/*.apk
